<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Support Desk{% endblock %}</title>
  <style>
    :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa; --accent:#0b5cad;
            --err:#b42318; --ok:#1a7f37; --warn:#9a6700; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    header .wrap { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
    header a.brand { font-weight:600; color:var(--fg); text-decoration:none; }
    nav { display:flex; gap:12px; align-items:center; }
    main.wrap { padding:24px 16px; }
    .wrap { max-width:960px; margin:0 auto; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input, textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    textarea { min-height:140px; resize:vertical; }
    .invalid { border-color:var(--err); }
    .field-error { color:var(--err); font-size:13px; margin-top:4px; }
    button { margin-top:16px; padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.link { background:none; color:var(--accent); padding:0; margin:0; }
    .notice { padding:10px 14px; border-radius:6px; margin-bottom:16px; }
    .notice.ok { background:#dafbe1; color:var(--ok); }
    .notice.err { background:#ffebe9; color:var(--err); }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:13px; color:var(--muted); font-weight:600; }
    .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid currentColor; }
    .p-high { color:var(--err); } .p-medium { color:var(--warn); } .p-low { color:var(--muted); }
    .review { color:var(--warn); }
    .muted { color:var(--muted); }
    .filter { display:flex; gap:8px; align-items:end; margin-bottom:16px; }
    .filter select { width:auto; } .filter button { margin:0; }
    .message { white-space:pre-wrap; word-break:break-word; }
    dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0; }
    dt { color:var(--muted); }
    .table-wrap { overflow-x:auto; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">Smart Support Desk</a>
      <nav>{% block nav %}<a href="/team">Team</a>{% endblock %}</nav>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
